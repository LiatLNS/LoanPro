version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: loanpro-app
    container_name: loanpro_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - loanpro-net

  web:
    image: nginx:alpine
    container_name: loanpro_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - loanpro-net

networks:
  loanpro-net:
    driver: bridge